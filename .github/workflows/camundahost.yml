# Builds the @agent-local/camundahost Camunda runtime image.
# Build is live and verifiable now; registry push + deploy are stubbed (see TODOs)
# until a container registry and runtime host exist.
name: camundahost

on:
  push:
    branches: [main]
    paths:
      - "src/camundahost/**"
      - ".github/workflows/camundahost.yml"
    tags:
      - "camundahost-v*"
  pull_request:
    paths:
      - "src/camundahost/**"
      - ".github/workflows/camundahost.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build camundahost image
        uses: docker/build-push-action@v6
        with:
          context: src/camundahost
          file: src/camundahost/Dockerfile
          build-args: |
            CAMUNDA_VERSION=8.7.6
          tags: agent-local-camundahost:ci
          push: false
          load: true

      # TODO(infra): wire registry push once a registry exists.
      #  - add docker/login-action@v3 with CAMUNDA_REGISTRY_* secrets
      #  - set push: true and tags to <registry>/agent-local-camundahost:<sha|tag>

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # TODO(infra): activate when a runtime host + registry land.
    # Gated off until then so the workflow stays green on build alone.
    if: false
    steps:
      - run: echo "deploy stubbed — pull the pushed image and roll the runtime host"
