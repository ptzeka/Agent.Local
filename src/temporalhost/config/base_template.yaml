# Local-authority auth fragment. Temporal loads base.yaml BEFORE the auto-setup-rendered
# docker.yaml and merges field-by-field, so this adds global.authorization without forking
# the upstream ~200-line config_template.yaml (economy: a fragment, not a maintained copy).
# startup.sh renders this with dockerize so the JWKS endpoint stays env-driven (M7-1 rule).
{{ if eq (default .Env.TEMPORAL_AUTH_ENABLED "false" | lower) "true" }}
global:
  authorization:
    # trust src/host as the local authority: validate caller bearer JWTs against its JWKS
    # (one-way pull, zero Go plugin) — the host signs RS256 tokens and publishes verify keys there
    jwtKeyProvider:
      keySourceURIs:
        - "{{ default .Env.TEMPORAL_JWKS_URI "http://host.docker.internal:3011/.well-known/jwks.json" }}"
      refreshInterval: "{{ default .Env.TEMPORAL_JWKS_REFRESH_INTERVAL "1m" }}"
    # the host's service token carries a Temporal-shaped "permissions" claim (<namespace>:<role>,
    # e.g. default:write, temporal-system:read) so the built-in mapper/authorizer need no custom code
    permissionsClaimName: "{{ default .Env.TEMPORAL_PERMISSIONS_CLAIM "permissions" }}"
    authorizer: "default"
    claimMapper: "default"
{{ end }}
