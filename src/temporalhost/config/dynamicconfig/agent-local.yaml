# Dynamic config baked into the agent-local Temporal image (single-node dev defaults).
# Server endpoints/secrets are NOT here — they arrive via env at run time (M7-1 rule).
# Keys kept minimal + version-robust; tune per workload rather than editing the image.

limit.maxIDLength:
  - value: 255
    constraints: {}

system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
    constraints: {}
