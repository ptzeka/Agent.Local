# Auth rules baked into the image. LOCAL DEV ONLY: the wide host rules below are acceptable because this
# stack is never exposed beyond the developer machine and every TCP login still requires the password.
#
# TYPE  DATABASE  USER  ADDRESS        METHOD
local   all       all                  trust
host    all       all   127.0.0.1/32   scram-sha-256
host    all       all   ::1/128        scram-sha-256
# compose network (pgAdmin) + host-mapped port: password-gated scram over TCP.
host    all       all   0.0.0.0/0      scram-sha-256
host    all       all   ::0/0          scram-sha-256
