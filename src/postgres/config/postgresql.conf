# Basic local-dev Postgres config, baked into the image (see ../Dockerfile). The server is launched with
# `-c config_file=/etc/postgresql/postgresql.conf` (see ../docker-compose.yml), so these win over defaults.

listen_addresses = '*'          # accept connections from the compose network + the mapped host port
port = 5432

max_connections = 100
shared_buffers = 128MB

# hba rules live beside this file (also baked into the image) instead of inside PGDATA, so auth policy is
# versioned with the repo rather than buried in the data volume.
hba_file = '/etc/postgresql/pg_hba.conf'

# data_directory intentionally unset: pg18+ images pick PGDATA (a version-specific subdir under
# /var/lib/postgresql) themselves, and the named volume in docker-compose mounts that parent dir.

# log to stderr so `docker compose logs postgres` surfaces errors during local dev.
log_min_messages = warning
log_statement = 'none'
