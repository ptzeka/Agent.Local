# Local self-managed Camunda 8 (Zeebe) broker for @agent-local/workflow.
# Start:  docker compose -f src/workflow/docker-compose.yml up -d
# Stop:   docker compose -f src/workflow/docker-compose.yml down
#
# The Node side connects over gRPC on :26500 with OAuth disabled (single-broker dev).
# See README env vars below.
services:
  zeebe:
    image: camunda/zeebe:8.7.6
    container_name: agent-local-zeebe
    ports:
      - "26500:26500" # gRPC gateway (ZEEBE_GRPC_ADDRESS)
      - "8080:8080"   # REST + monitoring
    environment:
      - ZEEBE_BROKER_NETWORK_HOST=0.0.0.0
      - ZEEBE_BROKER_GATEWAY_SECURITY_AUTHENTICATION_MODE=none
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/9600' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Optional Operate UI for inspecting instances; remove if not needed.
